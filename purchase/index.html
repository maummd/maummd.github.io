<!DOCTYPE html>
<html lang="ko"><head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="물품구매">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5D50">
<title>물품 구매 관리</title>
<style>
:root{--bg:#F4F5F1;--card:#fff;--ink:#1B2623;--sub:#4E5B56;--line:#D9DED7;--brand:#2F5D50;--brand2:#3E7A69;--soft:#E6F0EC;
--clinic:#3A6894;--center:#2F7A56;--brain:#8A5BA8;--warn:#B5602A;--wbg:#FBEEE2;--bad:#B03A3A;--bbg:#F8E3E3;--ok:#2F7A56;--okbg:#E2F1E8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;
 padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px);word-break:keep-all}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid #D3D9D2;border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13.5px;color:var(--sub);margin:10px 0 4px;font-weight:700}
header{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
header h1{font-size:21px;flex:1;line-height:1.25}
header h1 small{display:block;font-size:13.5px;color:var(--sub);font-weight:400}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:15px;margin:16px 0 8px;color:var(--brand)}
.muted{color:var(--sub);font-size:14px}
.btn{background:var(--brand);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:var(--bbg);color:var(--bad)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bd{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.bd.w{background:var(--wbg);color:var(--warn);border-color:transparent}
.bd.e{background:var(--bbg);color:var(--bad);border-color:transparent}
.site{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff}
.s-clinic{background:var(--clinic)}.s-center{background:var(--center)}.s-brain{background:var(--brain)}
.task{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #C8CFC7;flex:none;display:grid;place-items:center;font-weight:900;color:#fff;margin-top:1px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.half{background:linear-gradient(90deg,var(--ok) 50%,transparent 50%);border-color:var(--ok)}
.task .t{font-weight:700;font-size:16px}
.tbody{text-align:left;display:block}.edit{font-size:12.5px;opacity:.6}
.ckline{display:block;text-align:left;margin-top:6px;font-size:13.5px;color:var(--ok);background:var(--okbg);border-radius:8px;padding:4px 9px;width:100%}
.task .d{font-size:14px;color:var(--sub)}
.task.done .t{color:var(--sub);text-decoration:line-through}
.alert{font-size:15px;border-radius:12px;padding:11px 13px;margin-bottom:8px}
.alert.w{background:var(--wbg);color:var(--warn)}.alert.e{background:var(--bbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
.biz{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.biz b{font-size:18px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-size:14.5px;white-space:nowrap;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stock{display:flex;gap:4px}
.stock button{padding:5px 8px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;background:#fff}
.stock button.on.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok);font-weight:700}
.stock button.on.low{background:var(--wbg);color:var(--warn);border-color:var(--warn);font-weight:700}
.stock button.on.out{background:var(--bbg);color:var(--bad);border-color:var(--bad);font-weight:700}
.ord{padding:11px 0;border-top:1px solid var(--line)}
.ord:first-child{border-top:none}
.ord .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--sub)}
.ord .n{font-weight:700;margin-top:3px;font-size:16.5px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:19px;color:var(--brand)}
.sum span{font-size:13.5px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:9px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12.5px;color:var(--sub);gap:1px;padding:4px 0;position:relative}
nav button .ic{font-size:22px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
nav .dot[hidden]{display:none}
.lrow{display:flex;gap:10px;align-items:center;width:100%;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.card h2+.lrow{border-top:none}
.ldate{flex:none;width:68px;font-weight:700;font-size:14.5px;color:var(--sub)}.ldate.today{color:#fff;background:var(--warn);border-radius:8px;padding:2px 6px;width:auto}
details summary{cursor:pointer;margin-top:4px}
nav .dot{position:absolute;top:2px;left:55%;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:15}
.modal .sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0}
.x{font-size:19px;color:var(--sub);line-height:1;padding:0 4px;margin-left:auto}
.steps li{margin:0 0 8px 18px}
.steps b{color:var(--brand)}
dl dt{font-size:13px;color:var(--sub);margin-top:8px;font-weight:700}
dl dd{white-space:pre-wrap}
.line{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.line .ln{flex:1;min-width:48px;text-align:center;background:var(--bg);border-radius:10px;padding:6px 2px}
.line .ln b{display:block;font-size:17px;color:var(--sub)}.line .ln span{font-size:10.5px;color:var(--sub);line-height:1.2;display:block}
.line .ln.on{background:var(--wbg)}.line .ln.on b{color:var(--warn)}
.line i{color:#B7C0B8;font-style:normal;font-size:13px}
button.alert{border:none;font:inherit;cursor:pointer}
input:disabled{background:#F2F3F0;color:var(--sub)}
</style></head><body>

<nav id="nav" hidden></nav>
<div class="toast" id="toast"></div>
<div id="modal"></div>

function onData(part){
  for(const k of Object.keys(part)){
    S[k]=part[k];
    if(Array.isArray(part[k]))BASE[k]=Object.fromEntries(part[k].map(x=>[x.id,JSON.stringify(x)]));
    else if(k==='org')BASE.org=part[k]?Object.fromEntries(['name','settings','items','routine','checks','stock'].map(f=>[f,JSON.stringify(part[k][f]??null)])):{};
  }
  if(!S.me||S.me.active===false){if('me' in part){ready=false;view='gone';render()}return}
  ready=true;
  if(!$('#modal').innerHTML||part.me)render();else renderNav();
  syncReminders();
}

function save(){
  if(!ORG)return;
  const errs=e=>{console.error(e);toast('⚠️ 저장하지 못했어요 — 권한 또는 연결을 확인하세요')};
  for(const col of ['requests','orders','surveys','lunch']){
    const base=BASE[col]||{},cur=S[col]||[],ids=new Set(cur.map(x=>x.id));
    cur.forEach(x=>{const j=JSON.stringify(x);if(base[x.id]!==j){base[x.id]=j;const {id,...d}=x;ST.put(ORG,col,id,d).catch(errs)}});
    Object.keys(base).forEach(id=>{if(!ids.has(id)){delete base[id];ST.del(ORG,col,id).catch(errs)}});
    BASE[col]=base;
  }
  if(S.org){const patch={};BASE.org=BASE.org||{};['name','settings','items','routine','checks','stock'].forEach(f=>{const j=JSON.stringify(S.org[f]??null);if(BASE.org[f]!==j){BASE.org[f]=j;patch[f]=S.org[f]}});
    if(Object.keys(patch).length)ST.saveOrg(ORG,patch).catch(errs)}
  syncReminders();
}

const by=st=>S.orders.filter(o=>o.stage===st);

/* ===================== 알림 목록 (할 일) ===================== */
function myQueue(){
  const q=[],t=today();
  if(has('mid')){
    const r=S.requests.filter(x=>x.status==='submitted');if(r.length)q.push({lvl:'w',go:'demand',txt:`📩 수요 검수 ${r.length}건`});
    const o=by('review');if(o.length)q.push({lvl:'w',go:'order',of:'review',txt:`🔎 주문서 검수 ${o.length}건 · ${won(sumP(o))}`});
    const a=S.orders.filter(o=>o.stage==='arrived'||(o.stage==='ship'&&o.eta&&o.eta<=t));if(a.length)q.push({lvl:'w',go:'order',of:'recv',txt:`📦 수령 검수 ${a.length}건`});
  }
  if(has('final')){const o=by('final');if(o.length)q.push({lvl:'w',act:'finalView',txt:`👨‍⚕️ 원장님 결재 ${o.length}건 · ${won(sumP(o))}`})}
  if(has('buyer')){
    const r=S.requests.filter(x=>x.status==='accepted');if(r.length)q.push({lvl:'w',go:'demand',txt:`🧾 검수 통과한 수요 ${r.length}건 — 주문서 작성`});
    const p=by('pay');if(p.length)q.push({lvl:'ok',go:'order',of:'pay',txt:`💳 결재 완료 · 결제할 주문 ${p.length}건 · ${won(sumP(p))}`});
    const rj=by('reject');if(rj.length)q.push({lvl:'e',go:'order',of:'all',txt:`↩️ 반려된 주문서 ${rj.length}건 — 고쳐서 다시 올리기`});
    S.orders.forEach(o=>{
      if(o.stage==='ship'&&o.eta&&o.eta<t)q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: 배송 예정일(${md(o.eta)})이 지났어요`});
      if(o.meal&&['ship','pay','final','review'].includes(o.stage)&&(!o.eta||o.eta>=o.meal))q.push({lvl:'e',go:'order',txt:`🍱 ${o.name}: 식사일(${md(o.meal)}) 전날까지 도착하지 않아요`});
    });
  }
  if(has('buyer')||has('mid'))S.orders.filter(o=>o.stage==='issue').forEach(o=>q.push({lvl:'e',go:'order',of:'recv',txt:`⚠️ ${o.name}: ${o.issue||'누락 · 파손'} — 교환 또는 재주문`}));
  return q;
}

function bizValid(n){const d=String(n).replace(/\D/g,'').split('').map(Number);if(d.length!==10)return false;const w=[1,3,7,1,3,7,1,3,5];let s=0;for(let i=0;i<9;i++)s+=d[i]*w[i];s+=Math.floor(d[8]*5/10);return (10-s%10)%10===d[9]}

function shopUrl(o){
  let u=String(o.url||'').trim();

function parseLunchRules(text){
  const rules=[],pairs=[],notes=[],mentioned=new Set();let last=null;
  String(text||'').split(/\n/).forEach(raw=>{
    let line=raw.trim();if(!line)return;
    let note='';const arrow=line.search(/→|->(?![^()]*\))/);
    if(/^(→|->)/.test(line)){if(last)notes.push({match:last,note:line.replace(/^(→|->)\s*/,'')});return}
    const ni=line.indexOf('→');if(ni>0){note=line.slice(ni+1).trim();line=line.slice(0,ni).trim()}
    line=line.replace(/^(기타|기\s*∥|타\s*∥|기∥|타∥)\s*/,'').replace(/^(기타|타\s*∥|타∥)\s*/,'');
    const pm=line.match(/0\.5\s*\+\s*0\.5\s*:\s*(.+)$/);
    if(pm){const ns=pm[1].split(/[+,]/).map(x=>x.trim()).filter(Boolean);if(ns.length>=2)pairs.push(ns.slice(0,2));return}
    const ci=line.indexOf(':');if(ci<0)return;
    const left=line.slice(0,ci).replace(/\s*[xX×]\s*$/,'').replace(/모든\s*/g,'').trim();
    const match=left.split('&').map(x=>x.trim()).filter(Boolean);if(!match.length)return;
    last=match;if(note)notes.push({match,note});
    const right=line.slice(ci+1).replace(/(->|→)\s*[^/()]*$/,'');
    right.split('/').forEach(seg=>{const re=/([^()]+?)\s*\(([^)]*)\)/g;let m;
      while((m=re.exec(seg))){const people=m[1].split(/[,，]/).map(x=>x.trim()).filter(Boolean);if(people.length)rules.push({match,people,sub:m[2].trim(),label:left})}
      seg.replace(/[^()]*\([^)]*\)/g,'').split(/[,，]/).map(x=>x.trim()).filter(x=>/^[가-힣A-Za-z]{2,10}$/.test(x)).forEach(x=>mentioned.add(x))});
  });
  return {rules,pairs,notes,mentioned:[...mentioned]};
}

/* ----- 주문표 읽기 (표 글자 위치 → 날짜별 칸) ----- */
// 도시락 주문표 읽기 (PDF 글자 위치 → 표) — 앱과 같은 코드를 node에서 시험
function shParsePages(pages){
  // pages: [{items:[{s,x,y,w}]}]  y: 위가 큼
  const out=[];
  const HDR=/^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\(\s*[월화수목금토일]\s*\)\s*(?::\s*[\d+\s]*)?$/;
  for(const pg of pages){
    const items=pg.items.filter(i=>i.s.trim());
    const text=shLines(items).join('\n');
    const tm=text.match(/\[([^\]]+)\]\s*(\d{4})\s*\.\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*~\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*(.*?)\s*주문표(?:\s*\/\s*([\d-]+))?/);
    if(!tm)continue;
    const [,orgName,yy,sm,,em]=tm;const store=tm[7].replace(/\s*\(\s*/g,'(').replace(/\s*\)\s*/g,')').replace(/\s+/g,' ').trim(),storePhone=tm[8]||'';
    const base=+((text.match(/기본\s*개수는\s*(\d+)\s*개/)||[])[1]||0);
    const centerPhone=((text.match(/전화\s*\)\s*(\d{2,3}\s*[-–]\s*\d{3,4}\s*[-–]\s*\d{4})/)||[])[1]||'').replace(/\s/g,'').replace(/–/g,'-');
    // 머리글(날짜) 찾기: '11/16' 와 '(월)'이 따로 떨어진 경우도 합치기
    const hs=shTokens(items).filter(t=>HDR.test(t.s));
    const rows=[];hs.sort((a,b)=>b.y-a.y).forEach(h=>{const r=rows.find(r=>Math.abs(r.y-h.y)<4);if(r)r.h.push(h);else rows.push({y:h.y,h:[h]})});
    rows.forEach(r=>r.h.sort((a,b)=>a.x-b.x));
    const days=[];
    rows.forEach((r,ri)=>{
      const top=r.y-2,bottom=ri+1<rows.length?rows[ri+1].y+2:-1e9;
      const cols=r.h.map(h=>{const m=h.s.match(HDR);const cm=h.s.match(/:\s*([\d+\s]+)$/);return {cx:h.x+h.w/2,mo:+m[1],d:+m[2],count:cm?cm[1].split('+').reduce((a,b)=>a+(+b||0),0):0}});
      const cell=cols.map(()=>[]);
      const hdrIds=new Set(r.h.flatMap(h=>h.parts));
      items.forEach(i=>{if(i.y<top&&i.y>bottom&&!hdrIds.has(i)&&!rows.some(rr=>rr.h.some(h=>h.parts.includes(i)))){const cx=i.x+i.w/2;let k=0,best=1e9;cols.forEach((c,j)=>{const dd=Math.abs(c.cx-cx);if(dd<best){best=dd;k=j}});cell[k].push(i)}});
      cols.forEach((c,j)=>{let y=+yy;if(c.mo<+sm&&+sm-c.mo>6)y++;const ds=`${y}-${String(c.mo).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
        days.push({date:ds,count:c.count,raw:shLines(cell[j]).join(' ').replace(/\s+/g,' ').trim()})});
    });
    out.push({orgName:orgName.trim(),store,storePhone,centerPhone,base,from:days[0]&&days[0].date,to:days.length?days[days.length-1].date:'',days:days.map(d=>{const p=shParseCell(d.raw);if(p.lines&&d.count){const known=p.lines.reduce((a,l)=>a+l.qty,0);const z=p.lines.filter(l=>!l.qty);if(z.length===1)z[0].qty=Math.max(0,d.count-known)}return {...d,...p}})});
  }
  return out;
}
// 같은 줄에서 붙어 있는 글자 조각을 한 낱말로 합치기 ('11/16' '(' '월' ')' → '11/16(월)')
function shTokens(items){const out=[];[...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const t=out[out.length-1];
  if(t&&Math.abs(t.y-i.y)<2&&i.x-(t.x+t.w)<=16&&i.x>=t.x){t.s+=(i.x-(t.x+t.w)>2?' ':'')+i.s;t.w=i.x+i.w-t.x;t.parts.push(i)}else out.push({s:i.s,x:i.x,y:i.y,w:i.w,parts:[i]})});return out}
function shLines(items){const ls=[];[...items].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=ls.find(l=>Math.abs(l.y-i.y)<3);if(l)l.it.push(i);else ls.push({y:i.y,it:[i]})});
  return ls.map(l=>l.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim())}
function shParseCell(raw){
  const t=String(raw||'').trim();
  if(!t||/^[xX✕×]$/.test(t))return {off:true,note:''};
  if(/^[xX✕×]?\s*\(?\s*(대체\s*)?(공휴일|휴일|추석|설날|설|휴무|연휴|방학|소풍|나들이|행사|휴관|휴강|휴원|종강|개천절|한글날|성탄절|크리스마스|어린이날|현충일|광복절|삼일절|선거일?)\s*\)?$/.test(t)||/^[xX]\s*\((.+)\)$/.test(t))return {off:true,note:t.replace(/^[xX✕×]\s*\(?/,'').replace(/\)$/,'').trim()};
  const parts=t.replace(/\s*\+\s*/g,'+').replace(/\s*,\s*(?=[가-힣(])/g,'+').split('+').map(x=>x.trim()).filter(Boolean);
  const L=[];
  parts.forEach(p=>{
    let price=0;const pm=p.match(/\(?\s*([\d,]{3,6})\s*원?\s*\)?/);
    let q=0;const qm=p.match(/(\d+)\s*개/);if(qm)q=+qm[1];
    let name=p.replace(/\(\s*[\d,]{3,6}\s*원?\s*\)/g,' ').replace(/(\d+)\s*개/g,' ').replace(/[()]/g,' ');
    if(pm&&/[\d,]{3,}/.test(pm[1])&&/\(|원/.test(p))price=+pm[1].replace(/,/g,'');
    const tail=name.match(/^(.*?[가-힣])\s*(\d{1,2})\s*$/);if(tail&&!q){name=tail[1];q=+tail[2]}
    name=name.replace(/\s+/g,' ').trim();
    if(!name)return;
    // '+ 미니반찬 볶음김치 (400원)' 처럼 곁들임은 앞 줄에 붙이기
    if(/^미니반찬|^오징어젓갈|^볶음김치/.test(name)&&L.length){L[L.length-1].side=(L[L.length-1].side?L[L.length-1].side+' ':'')+name;return}
    L.push({name,qty:q,price});
  });
  if(!L.length)return {off:true,note:t};
  return {menu:L[0].name,lines:L};
}

/* ===================== 📥 도시락 주문표 불러오기 (PDF · HWPX) =====================
   기존 주문표 파일에서 날짜 · 메뉴 · 수량 · X(휴일)를 읽어 날짜별 주문으로 넣습니다.
   읽는 도구(pdf.js, fflate)는 불러오기를 누를 때만 인터넷에서 받아요. */
const SHEET_LIB={pdf:'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs',worker:'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs',zip:'https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js'};
async function readPdfPages(buf){
  const pdfjs=await import(SHEET_LIB.pdf);
  pdfjs.GlobalWorkerOptions.workerSrc=SHEET_LIB.worker;  // 다른 주소의 작업 파일은 pdf.js가 알아서 감싸 쓰고, 안 되면 화면에서 직접 읽어요
  const doc=await pdfjs.getDocument({data:new Uint8Array(buf)}).promise,pages=[];
  for(let i=1;i<=doc.numPages;i++){const p=await doc.getPage(i);const tc=await p.getTextContent();pages.push({items:tc.items.filter(it=>it.str).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width}))})}
  return pages;
}
// HWPX(한글 새 형식): 압축을 풀어 문단 글자와 표(행 · 칸)를 차례대로 읽어 PDF와 같은 모양으로 만듭니다.
async function readHwpxPeriods(buf){
  const {unzipSync,strFromU8}=await import(SHEET_LIB.zip);
  const files=unzipSync(new Uint8Array(buf));
  const secs=Object.keys(files).filter(n=>/Contents\/section\d+\.xml$/i.test(n)).sort();
  if(!secs.length)throw new Error('한글 문서 내용을 찾지 못했어요');
  const pages=[];let y=0;
  const push=(s,x)=>{if(s.trim())pages[pages.length-1].items.push({s,x,y,w:Math.max(8,s.length*12)})};
  secs.forEach(n=>{const xml=new DOMParser().parseFromString(strFromU8(files[n]),'application/xml');
    const ln=e=>e.localName;const textOf=e=>[...e.getElementsByTagNameNS('*','t')].map(t=>t.textContent).join('');
    const walk=el=>{for(const c of el.children){
      if(ln(c)==='tbl'){[...c.children].filter(r=>ln(r)==='tr').forEach(tr=>{y-=40;[...tr.children].filter(t=>ln(t)==='tc').forEach((tc,ci)=>{
          const ps=[...tc.getElementsByTagNameNS('*','p')];let yy=y;ps.forEach(p=>{const s=textOf(p);if(s.trim()){pages[pages.length-1]||pages.push({items:[]});pages[pages.length-1].items.push({s,x:ci*150+10,y:yy,w:120});yy-=12}})})});y-=40;continue}
      if(ln(c)==='p'&&!c.getElementsByTagNameNS('*','tbl').length){const s=textOf(c);if(/주문표/.test(s)&&/\[.*\]/.test(s)){pages.push({items:[]});y=1000}if(!pages.length)pages.push({items:[]});y-=20;push(s,10);continue}
      walk(c)}};
    walk(xml.documentElement)});
  return pages;
}
async function importSheetFile(f){
  const name=f.name||'',buf=await f.arrayBuffer();
  if(/\.hwp$/i.test(name))throw new Error('한글(.hwp) 파일은 한글에서 [파일 → 다른 이름으로 저장 → PDF 또는 HWPX]로 저장해 올려 주세요');
  const pages=/\.hwpx$/i.test(name)?await readHwpxPeriods(buf):await readPdfPages(buf);
  const res=shParsePages(pages).filter(p=>p.days.length);
  if(!res.length)throw new Error('주문표 모양을 찾지 못했어요. 제목에 "[기관] 2026. 11/16 ~ 12/4 ○○ 주문표"가 있는 파일인지 확인해 주세요');
  res.forEach(p=>p.days.forEach(d=>{if(d.lines&&d.lines.length===1&&!d.lines[0].qty&&p.base)d.lines[0].qty=p.base}));
  return res.sort((a,b)=>(b.from||'').localeCompare(a.from||''));
}
let sheetImport=null;
function sheetPreview(){
  const R=sheetImport,cut=ymd(addDays(new Date(),-90));
  modal(`<h3>📥 주문표 불러오기</h3><p class="muted">${R.length}개 기간을 찾았어요. 넣을 기간을 골라 주세요.</p>

function at(dateStr,hm){const [h,m]=(hm||'09:00').split(':').map(Number);const d=new Date(dateStr+'T00:00');d.setHours(h||0,m||0,0,0);return d.getTime()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function buildReminders(){
  const N=L.noti,out=[],now=Date.now();if(!N.on||!S.me)return out;
  const push=(id,t,title,body)=>{if(t>now+30000)out.push({id,at:t,title,body})};
  S.surveys.filter(s=>s.open&&s.due).forEach(s=>{if(!S.requests.some(r=>r.surveyId===s.id&&r.by===AUTH.uid))push('sv-'+s.id,at(ymd(addDays(new Date(s.due+'T00:00'),-1)),N.time),`📝 내일 마감: ${s.title}`,'필요한 물품이 있으면 수요를 내 주세요')});
  if(!isMgr())return out.sort((a,b)=>a.at-b.at);
  const rt=c=>ROUTINE().filter(r=>r.cycle===c);
  const doneAll=(c,d)=>rt(c).every(r=>{const x=CHECKS()[r.id+'|'+periodKey(c,d)];return x&&(x.n||1)>=need(c)});
  if(N.cyc&&(has('buyer')||has('mid')))for(let i=0;i<60;i++){const d=addDays(new Date(),i),ds=ymd(d),dow=d.getDay();
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    if(rt('M1').length&&d.getDate()===Math.min(+N.monthDay||1,last)&&!doneAll('M1',d))push('m-'+ds,at(ds,N.time),`📅 ${d.getMonth()+1}월 간식 수요조사 · 구매`,rt('M1').map(r=>r.text).join(' / '));
    if(rt('W1').length&&dow===+N.weekDay&&!doneAll('W1',d))push('w-'+ds,at(ds,N.time),'📋 이번 주 재고 확인',rt('W1').map(r=>r.text).join(' / '));
    if(rt('W2').length&&(N.w2Days||[]).map(Number).includes(dow)){const k=CHECKS()[rt('W2')[0].id+'|'+periodKey('W2',d)];const cnt=k?(k.n||1):0;const idx=(N.w2Days||[]).map(Number).sort().indexOf(dow);if(cnt<=idx)push('r-'+ds,at(ds,N.time),'🍱 레토르트 주문 · 도착 확인',rt('W2').map(r=>r.text).join(' / '))}
  }
  if(N.order)S.orders.forEach(o=>{
    if(o.stage==='ship'&&o.eta&&(has('buyer')||has('mid'))){push('e-'+o.id,at(o.eta,N.time),has('mid')?'📦 오늘 도착 예정 — 수령 검수':'📦 오늘 도착 예정',`${SITES[o.site]} · ${o.name} ${o.qty||''}`);push('e2-'+o.id,at(ymd(addDays(new Date(o.eta+'T00:00'),1)),N.time),'⚠️ 수령 검수가 안 됐어요',`${SITES[o.site]} · ${o.name} — 미도착 · 누락 확인`)}
    if(o.meal&&has('buyer')&&!['done','reject'].includes(o.stage))push('meal-'+o.id,at(ymd(addDays(new Date(o.meal+'T00:00'),-1)),'15:00'),'🍱 내일 식사용 레토르트 도착했나요?',`${SITES[o.site]} · ${o.name} — 식사일 ${md(o.meal)}`);
  });
  if(N.order&&LC()&&(has('buyer')||has('mid')))for(let i=0;i<14;i++){const ds=ymd(addDays(new Date(),i)),pl=planDay(ds);if(pl&&(pl.d.status||'plan')==='plan'){const [h,m]=(LC().deadline||'10:00').split(':').map(Number);const t=`${pad(Math.max(0,h-1))}:${pad(m||0)}`;push('lunch-'+ds,at(ds,t),`🍱 오늘 도시락 ${pl.count}개 — ${LC().deadline} 전 확인`,`${orderLine(pl)} · 결석 · 추가 인원이 있으면 업체에 연락`)}}
  if(N.approve){let k=0;for(let i=0;i<10&&k<3;i++){const d=addDays(new Date(),i),dow=d.getDay();if(dow===0||dow===6)continue;const ds=ymd(d);
      if(has('mid')){const n=S.requests.filter(r=>r.status==='submitted').length+by('review').length+by('arrived').length;if(n)push('mid-'+ds,at(ds,N.time),`🔎 검수할 것 ${n}건`,'수요 · 주문서 · 수령 검수를 확인해 주세요')}
      if(has('final')&&by('final').length)push('fin-'+ds,at(ds,N.lunch),`👨‍⚕️ 결재 대기 ${by('final').length}건`,`합계 ${won(sumP(by('final')))} — 점심 회의 때 결재해 주세요`);
      if(has('buyer')){const p=by('pay').length,a=S.requests.filter(r=>r.status==='accepted').length;if(p)push('pay-'+ds,at(ds,N.time),`💳 결제할 주문 ${p}건`,'원장님 결재가 끝났어요 — 결제 방지 키로 결제하세요');if(a)push('acc-'+ds,at(ds,N.time),`🧾 주문서 쓸 수요 ${a}건`,'검수 통과한 수요를 주문서로 만들어 주세요')}
      k++}}
  return out.sort((a,b)=>a.at-b.at).slice(0,60);
}

    case 'lunchSheet':exportDoc(lunchSheetDoc(),`도시락_주문표_${lunchPeriod()[0]}`);break;
    case 'lunchCopyPrev':{const days=lunchPeriod(),n=days.length/5*7;let c=0;days.forEach(ds=>{if(lday(ds)&&(lday(ds).menu||lday(ds).off))return;const x=new Date(ds+'T00:00');x.setDate(x.getDate()-n);const p=lday(ymd(x));if(p&&(p.menu||p.off)){S.lunch.push({id:'d-'+ds,date:ds,menu:p.menu,off:p.off,note:p.off?p.note:'',guests:p.guests||0,status:'plan'});c++}});save();render();toast(c?`${c}일 메뉴를 가져왔어요 (이미 정한 날은 그대로)`:'가져올 메뉴가 없어요');break}
    case 'lcStoresSave':{const c=LC();c.stores=$('#lcStores').value.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(a=>a[0]).map(([name,phone,mobile,mobileName,note])=>({name,phone:phone||'',mobile:mobile||'',mobileName:mobileName||'',note:note||''}));const cur=c.stores.find(x=>x.name===c.store);if(cur){c.storePhone=cur.phone}save();render();toast('업체 목록을 저장했어요');break}
    case 'lcMembersSave':{const c=LC();c.members=$('#lcMembers').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({name:x.replace(/^-\s*/,''),active:!x.startsWith('-')}));save();render();toast('회원 명단을 저장했어요');break}
    case 'lcMenusSave':{const c=LC();c.menus=$('#lcMenus').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const [n,p]=x.split('|').map(y=>(y||'').trim());return {name:n,price:+String(p||'').replace(/[^\d]/g,'')||0}});
      c.alias=$('#lcAlias').value.split('\n').map(x=>x.split('=').map(y=>y.trim())).filter(a=>a[0]&&a[1]);c.centerItems=$('#lcCenter').value.split(',').map(x=>x.trim()).filter(Boolean);save();render();toast('메뉴를 저장했어요');break}
    case 'lcRulesSave':{const c=LC();c.rulesText=$('#lcRules').value;const r=parseLunchRules(c.rulesText);save();render();toast(`규칙 ${r.rules.length}개 · 0.5+0.5 ${r.pairs.length}쌍을 읽었어요`);break}
    case 'pwaInstall':if(_ip){_ip.prompt();_ip=null}break;
    case 'copyBiz':if(!SET().bizNo){toast('사업자등록번호가 아직 없어요');break}copy(SET().bizNo,'사업자등록번호를 복사했어요');break;
    case 'newOrder':window._resubmit=false;orderForm();break;
    case 'newReq':reqForm();break;
    case 'newSurvey':surveyForm();break;
    case 'saveSurvey':{const ti=$('#sTitle').value.trim();if(!ti){toast('제목을 적어 주세요');return}S.surveys.push({id:uid(),title:ti,site:$('#sSite').value,due:$('#sDue').value,note:$('#sNote').value.trim(),open:true,at:new Date().toISOString(),by:AUTH.uid,byName:myName()});save();closeModal();toast('수요조사를 열었어요 — ‘직원에게 알리기’로 알려 주세요');break}
    case 'saveReq':{const nm=$('#rName').value.trim();if(!nm){toast('품목을 적어 주세요');return}const sv=$('#rSv')?$('#rSv').value:'';S.requests.push({id:uid(),at:new Date().toISOString(),by:AUTH.uid,byName:myName(),site:$('#fSite').value,name:nm,qty:$('#rQty').value.trim(),due:$('#rDue').value,reason:$('#rReason').value.trim(),surveyId:sv,status:'submitted'});save();closeModal();toast('수요를 냈어요 — 중간관리자가 검수해요');break}
    case 'lowToReq':{let n=0;ITEMS().forEach(i=>{const s=STOCK()[i.id];if(s&&s.state!=='ok'&&!S.requests.some(r=>['submitted','accepted'].includes(r.status)&&r.name===i.name&&r.site===i.site)){addReq(i.site,i.name,'',s.state==='out'?'재고 없음':'재고 부족');n++}});save();render();toast(n?`${n}개를 수요로 올렸어요`:'이미 모두 올라가 있어요');break}
    case 'finalView':finalScreen();break;
    case 'finalAll':by('final').forEach(o=>{o.stage='pay';logStage(o,'final')});save();closeModal();toast('모두 결재했어요');break;
    case 'pkCheck':pkCheck();break;
    case 'openCart':openShop('https://cart.coupang.com/cartView.pang');break;
    case 'payAllCoupang':needKey(()=>{const ok=by('pay').filter(o=>(o.vendor||'쿠팡')==='쿠팡');if(!ok.length){toast('결제할 쿠팡 주문이 없어요');return}payQueue=ok.map(o=>o.id);payPending=payQueue.shift();(SET().bizNo?copy(SET().bizNo,`사업자번호 복사됨 · ${ok.length}건 중 1번째를 열어요`):toast(`${ok.length}건 중 1번째를 열어요`));setTimeout(()=>openShop(shopUrl(ord(payPending))),400)});break;
    case 'setPayKey':{const a=$('#pk1').value,b=$('#pk2').value;if(!/^\d{4,8}$/.test(a)){toast('숫자 4~8자리로 정해 주세요');return}if(a!==b){toast('두 번 넣은 키가 달라요');return}
      const salt=uid()+uid();try{await ST.setPayKey(ORG,{salt,hash:await sha(salt+a)});$('#pk1').value=$('#pk2').value='';$('#pkState').textContent='✅ 저장했어요';toast('결제 방지 키를 저장했어요 — 구매 담당에게만 알려 주세요')}catch(err){toast(errMsg(err))}break}
    case 'shareCode':share(`[${orgName()}] 물품 구매 관리\n1) 아래 주소를 열고 이메일로 가입 (설치 필요 없음)\n${WEB_URL}\n2) 참여 코드 ${O().joinCode} 입력\n3) 수요 탭에서 필요한 물품을 내 주세요`);break;
    case 'newCode':try{await ST.newJoinCode(ORG,O().joinCode);toast('새 참여 코드를 만들었어요 — 예전 코드는 못 써요')}catch(err){toast(errMsg(err))}break;
    case 'editItems':editItemsForm();break;
    case 'saveItems':{const its=[],bad=[];$('#eItems').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [s,c,n,cy,r,st]=l.split('|').map(x=>(x||'').trim());const site=SITE_BY_NAME[s],cycle=CYC_BY_NAME[cy];if(!site||!n||!cycle){bad.push(i+1);return}const old=ITEMS().find(x=>x.site===site&&x.name===n);its.push({id:old?old.id:uid(),site,cat:c||'기타',name:n,cycle,rule:r||'',stock:/^o$/i.test(st||'')})});
      const rts=[],bad2=[];$('#eRoutine').value.split('\n').map(l=>l.trim()).filter(Boolean).forEach((l,i)=>{const [cy,...tx]=l.split('|').map(x=>x.trim());const cycle=CYC_BY_NAME[cy];if(!cycle||!tx.join('|')){bad2.push(i+1);return}const old=ROUTINE().find(x=>x.text===tx.join(' | '));rts.push({id:old?old.id:uid(),cycle,text:tx.join(' | ')})});
      if(bad.length||bad2.length){toast(`형식이 맞지 않는 줄: ${bad.length?'품목 '+bad.join(','):''} ${bad2.length?'정기 업무 '+bad2.join(','):''}`);return}
      S.org.items=its;S.org.routine=rts;save();closeModal();toast('저장했어요');break}
    case 'resetItems':S.org.items=DEFAULT_ITEMS();S.org.routine=DEFAULT_ROUTINE();save();closeModal();toast('인수인계서 기본값으로 되돌렸어요');break;
    case 'expPdf':{if(!spendRows(expFrom,expTo).length){toast('이 기간에 결제한 내역이 없어요');break}exportDoc(expenseDoc(),`월별지출내역_${expFrom}_${expTo}`);break}
    case 'expCsv':{if(!spendRows(expFrom,expTo).length){toast('이 기간에 결제한 내역이 없어요');break}const data=expenseCsv(),name=`월별지출내역_${expFrom}_${expTo}.csv`;
      if(window.AdminAndroid&&AdminAndroid.saveFile){AdminAndroid.saveFile(name,'text/csv',data);break}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('엑셀에서 열 수 있는 파일을 저장했어요');break}
    case 'printMonth':exportDoc(monthDoc(),`물품구매내역_${repMonth}`);break;
    case 'printHandover':exportDoc(handoverDoc(),`물품구매_인수인계서_${today().replace(/-/g,'')}`);break;
    case 'backup':{const data=JSON.stringify({app:'maum-purchase',v:2,savedAt:new Date().toISOString(),org:S.org,members:S.members,requests:S.requests,orders:S.orders,surveys:S.surveys});const name=`물품구매관리_기록_${today().replace(/-/g,'')}.json`;
      if(window.AdminAndroid&&AdminAndroid.saveFile){AdminAndroid.saveFile(name,'application/json',data);break}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();break}
    case 'notiPerm':if(window.AdminAndroid&&AdminAndroid.requestNotiPermission){AdminAndroid.requestNotiPermission();toast('알림 허용 창이 뜨면 ‘허용’을 눌러 주세요')}else toast('휴대폰 앱에서 쓸 수 있어요');break;
    case 'notiTest':if(window.AdminAndroid&&AdminAndroid.testNotification){AdminAndroid.testNotification('물품 구매 알림 시험','알림이 이렇게 떠요 ✅');toast('곧 시험 알림이 떠요')}else toast('휴대폰 앱에서 쓸 수 있어요');break;
    // 로그인 · 기관
    case 'signIn':case 'signUp':{const em=$('#aEmail').value.trim(),pw=$('#aPw').value;authMsg='';
      if(d.act==='signUp'&&pw!==$('#aPw2').value){authMsg='비밀번호 두 개가 달라요';render();return}
      t.disabled=true;try{if(d.act==='signUp'){await ST.signUp(em,pw);await ST.verify()}else await ST.signIn(em,pw)}catch(err){authMsg=errMsg(err);render()}break}
    case 'resetPw':{const em=$('#aEmail').value.trim();if(!em){authMsg='이메일을 먼저 적어 주세요';render();return}try{await ST.reset(em);toast('비밀번호 재설정 메일을 보냈어요')}catch(err){authMsg=errMsg(err);render()}break}
    case 'checkVerify':try{if(await ST.refresh()){AUTH.verified=true;startOrg()}else toast('아직 인증되지 않았어요 — 메일의 링크를 눌러 주세요')}catch(err){toast(errMsg(err))}break;
    case 'resendVerify':try{await ST.verify();toast('인증 메일을 다시 보냈어요')}catch(err){toast(errMsg(err))}break;
    case 'logout':if(UNSUB)UNSUB();UNSUB=null;ORG=null;ready=false;await ST.signOut();break;
    case 'leave':if(!confirmLeave()){break}if(UNSUB)UNSUB();UNSUB=null;ORG=null;ready=false;S={me:null,org:null,members:[],requests:[],orders:[],surveys:[],lunch:[]};await ST.leaveOrg();view='setup';render();break;
    case 'joinOrg':{const nm=$('#jName').value.trim(),cd=$('#jCode').value.trim();if(!nm||!cd){toast('이름과 참여 코드를 넣어 주세요');return}t.disabled=true;try{ORG=await ST.joinOrg(cd,nm);listenOrg()}catch(err){t.disabled=false;toast(errMsg(err))}break}
    case 'createOrg':{const on=$('#cOrg').value.trim(),nm=$('#cName').value.trim();if(!on||!nm){toast('기관 이름과 내 이름을 넣어 주세요');return}const roles=[...document.querySelectorAll('.cRole:checked')].map(x=>x.value);t.disabled=true;
      try{ORG=await ST.createOrg({orgName:on,myName:nm,roles,seed:{settings:{...DEFAULT_SETTINGS,bizNo:fmtBiz(($('#cBiz')||{}).value||'')},items:DEFAULT_ITEMS(),routine:DEFAULT_ROUTINE(),checks:{},stock:{}}});listenOrg()}catch(err){t.disabled=false;toast(errMsg(err))}break}
  }
});
let _leaveArm=0;function confirmLeave(){if(Date.now()-_leaveArm<4000)return true;_leaveArm=Date.now();toast('한 번 더 누르면 이 휴대폰에서 기관 연결을 끊어요');return false}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='sheetIn'&&el.files[0]){const f=el.files[0];el.value='';modal('<h3>📥 주문표 읽는 중…</h3><p class="muted">파일이 크면 잠시 걸려요.</p>');
    importSheetFile(f).then(r=>{sheetImport=r;sheetPreview()}).catch(err=>{console.error(err);modal(`<h3>읽지 못했어요</h3><p>${esc(err&&err.message||err)}</p><p class="muted" style="margin-top:6px">인터넷 연결이 필요해요 (읽는 도구를 처음 한 번 받아요).</p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="closeModal">닫기</button></div>`)});return}
  if(el.id==='repMonth'){repMonth=el.value;render();return}
  if(el.id==='expFrom'||el.id==='expTo'){if(el.id==='expFrom')expFrom=el.value;else expTo=el.value;if(expFrom>expTo){const t=expFrom;expFrom=expTo;expTo=t}const y=scrollY;render();scrollTo(0,y);return}
  if(el.id==='auOver'&&autoPlan){autoPreview(autoPlan.title,autoPlan.days);return}
  if(el.id==='expDetail'){expDetail=el.checked;return}
  if(el.id==='rSv'){const s=S.surveys.find(x=>x.id===el.value);if(s&&s.site&&s.site!=='all')$('#fSite').value=s.site;return}
  if(el.dataset.myname!==undefined){const v=el.value.trim();if(!v)return;const {id,...m}=S.me;ST.put(ORG,'members',id,{...m,name:v}).then(()=>toast('이름을 바꿨어요')).catch(err=>toast(errMsg(err)));return}
  if(el.dataset.org){S.org.name=el.value.trim()||orgName();save();toast('저장했어요');return}
  if(el.dataset.st){const k=el.dataset.st;S.org.settings={...SET(),[k]:['approveItem','approveOrder'].includes(k)?Math.max(0,+el.value||0):k==='bizNo'?fmtBiz(el.value):el.value.trim()};save();if(k==='bizNo')render();toast('저장했어요');return}
  if(el.dataset.addr){const s=SET();s.addr[el.dataset.addr]=el.value.trim();S.org.settings=s;save();toast('저장했어요');return}
  if(el.dataset.lc){const c=LC(),k=el.dataset.lc;const old=c.store;c[k]=['base','weeks'].includes(k)?(+el.value||0):el.value.trim();if((k==='store'||k==='storePhone')&&c.stores){const x=c.stores.find(y=>y.name===(k==='store'?old:c.store));if(x){x.name=c.store;x.phone=c.storePhone}}save();if(k==='weeks')render();toast('저장했어요');return}
  if(el.dataset.noti){const k=el.dataset.noti,N=L.noti;N[k]=el.type==='checkbox'?el.checked:(['monthDay','weekDay'].includes(k)?+el.value:el.value);saveL();render();toast('알림 설정을 저장했어요');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pkIn')pkCheck()});

/* ===================== 시작 ===================== */
function listenOrg(){if(UNSUB)UNSUB();ready=false;S={me:null,org:null,members:[],requests:[],orders:[],surveys:[],lunch:[]};BASE={};view='home';
  $('#app').innerHTML='<div class="empty" style="padding-top:40vh">기관 자료를 불러오는 중…</div>';
  UNSUB=ST.listen(ORG,onData,(err,key)=>{console.error(key,err);if(key==='me'||key==='org'){toast('기관 자료를 볼 권한이 없어요');}})}
async function startOrg(){
  try{const me=await ST.loadMe();if(me&&me.orgId){ORG=me.orgId;listenOrg()}else{view='setup';render()}}
  catch(err){toast(errMsg(err));view='setup';render()}
}
ST.onAuth(u=>{AUTH=u;if(UNSUB){UNSUB();UNSUB=null}ORG=null;ready=false;
  if(!u){view='auth';render();return}
  if(!u.verified){view='auth';render();return}
  startOrg();
});
let _ip=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_ip=e;if(view==='settings'||view==='auth')render()});
const IS_WEB=!window.AdminAndroid,WEB_URL='https://maummd.github.io/purchase/';
function webCard(){if(!IS_WEB||matchMedia('(display-mode: standalone)').matches)return '';
  return `<div class="card"><h2>📲 홈 화면에 추가</h2><p class="muted" style="font-size:12.5px">설치 없이 이 주소로 바로 써요. 홈 화면에 추가하면 앱처럼 아이콘이 생겨요.<br>안드로이드: 크롬 메뉴(⋮) → ‘홈 화면에 추가’ · 아이폰: 사파리 공유 → ‘홈 화면에 추가’</p>${_ip?'<button class="btn" style="margin-top:8px" data-act="pwaInstall">홈 화면에 추가</button>':''}</div>`}
window.nuBack=function(){if($('#modal').innerHTML){closeModal();return true}const T=tabs();if(ORG&&view!==T[0][0]){view=T[0][0];render();scrollTo(0,0);return true}return false};
window.__test={sheetImage,changesSms,sheetChanges,autoFill,rankDay,autoCtx,parsePrefs,shParsePages,shParseCell,importSheetFile,planDay,parseLunchRules,lunchSheetDoc,lunchServeDoc,S:()=>S,buildReminders,myQueue,monthDoc,handoverDoc,bizValid,sha};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(payPending)onReturn();syncReminders()}});
