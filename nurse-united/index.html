<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nurse United">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<title>Nurse United</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2330;--sub:#667085;--line:#e2e6ec;--brand:#1f4e79;--brand2:#2f6fa8;--soft:#e7eff8;
--S:#1f6f4a;--A:#2f7f9a;--B:#5b6b80;--C:#b2762b;--D:#b04a3a;--okbg:#e4f3ea;--okfg:#22704a;--wbg:#fbeee2;--wfg:#a65a1f;--ebg:#f9e3e1;--efg:#a2392c}
@media (prefers-color-scheme:dark){:root{--bg:#12151a;--card:#1c2027;--ink:#e8ebf0;--sub:#9aa3b2;--line:#2c323c;--brand:#8fb8e3;--brand2:#8fb8e3;--soft:#1f2b3a;
--S:#6fcf9f;--A:#6fc0dc;--B:#a6b3c4;--C:#e5ad69;--D:#ee8a7c;--okbg:#1b3127;--okfg:#7fd3a5;--wbg:#3a2b1e;--wfg:#f0b07a;--ebg:#3d2220;--efg:#f19a8f}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
 padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 80px)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
header{display:flex;align-items:center;gap:8px;margin:6px 0 12px;min-height:40px}
header h1{font-size:19px;flex:1;line-height:1.25}
header h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.logo{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.sync{font-size:11px;color:var(--sub);text-align:right}
.back{font-size:24px;padding:0 6px 0 0;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14.5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3{font-size:13.5px;margin:12px 0 6px;color:var(--brand)}
.muted{color:var(--sub);font-size:13px}
.btn{background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--brand)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--ebg);color:var(--efg)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.person{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:50%;background:var(--soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.nm{font-weight:700}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bd{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--okbg);color:var(--okfg);border-color:transparent}
.bd.w{background:var(--wbg);color:var(--wfg);border-color:transparent}
.bd.e{background:var(--ebg);color:var(--efg);border-color:transparent}
.score{font-weight:700;font-size:18px;color:var(--brand);text-align:right;min-width:46px}
.score small{display:block;font-size:10px;color:var(--sub);font-weight:400}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top));z-index:3}
.tabs button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;color:var(--sub)}
.tabs button.on{background:var(--brand);color:#fff;font-weight:700}
dl dt{font-size:12px;color:var(--sub);margin-top:10px}
dl dt:first-child{margin-top:0}
dl dd{white-space:pre-wrap;word-break:break-word}
.obs{padding:10px 0;border-top:1px solid var(--line)}
.obs:first-child{border-top:none}
.obs .h{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);flex-wrap:wrap}
.obs p{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.x{margin-left:auto;font-size:19px;color:var(--sub);line-height:1;padding:0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--bg)}
.seg button.on.g{background:var(--okbg);color:var(--okfg);border-color:var(--okfg);font-weight:700}
.seg button.on.w{background:var(--wbg);color:var(--wfg);border-color:var(--wfg);font-weight:700}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item .t b{font-size:14.5px}
.item .def{font-size:12.5px;color:var(--sub);margin-top:2px}
.ind{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px;white-space:pre-wrap}
.grades{display:flex;gap:5px;margin-top:8px}
.grades button{flex:1;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-weight:700;color:var(--sub);line-height:1.05;font-size:14px}
.grades button small{display:block;font-size:10px;font-weight:400}
.grades button.on{color:#fff;border-color:transparent}
.grades button.on[data-g=S]{background:var(--S)}.grades button.on[data-g=A]{background:var(--A)}.grades button.on[data-g=B]{background:var(--B)}.grades button.on[data-g=C]{background:var(--C)}.grades button.on[data-g=D]{background:var(--D)}
.basis{margin-top:6px;min-height:44px;font-size:13.5px}
.evid{font-size:11.5px;color:var(--sub);white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:20px;color:var(--brand)}
.sum span{font-size:11.5px;color:var(--sub)}
.notice{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.alert{font-size:13px;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.alert.w{background:var(--wbg);color:var(--wfg)}.alert.e{background:var(--ebg);color:var(--efg)}.alert.ok{background:var(--okbg);color:var(--okfg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:12px}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--brand2)}
.dist{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:6px 0}
.dist i{display:grid;place-items:center;color:#fff;font-size:11px;font-style:normal;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:2px;padding:4px 0}
nav button.on{color:var(--brand);font-weight:700}
nav svg{width:22px;height:22px}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:16px 0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.ai{white-space:pre-wrap;font-size:14px}
details summary{cursor:pointer;font-size:12.5px;color:var(--brand);margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;white-space:nowrap;background:var(--card)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:15}
.modal .sheet{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
.modal h3{font-size:16px;margin-bottom:8px}
.noai [data-ai],.noai .aic{display:none!important}
.lock{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center}
.pin{display:flex;gap:10px}.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}.pin i.on{background:var(--brand)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px}.keys button{height:58px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:22px}
.loader{display:grid;place-items:center;min-height:50vh;color:var(--sub)}
</style>
</head>

/* ===================== 계산 ===================== */
function calc(p){
  const t=T(p.job), g=(p.eval&&p.eval.grades)||{};
  const pv=t.perf.map(i=>GPT[g[i.k]]).filter(Boolean), cv=t.comp.map(i=>GPT[g[i.k]]).filter(Boolean);
  const perf=pv.length===t.perf.length?pv.reduce((a,b)=>a+b,0)/pv.length:null;
  const comp=cv.length===t.comp.length?cv.reduce((a,b)=>a+b,0)/cv.length:null;
  const w=(t.perfW??50)/100;
  const total=perf!=null&&comp!=null?perf*w+comp*(1-w):null;
  return {perf,comp,total,filled:pv.length+cv.length,need:t.perf.length+t.comp.length};
}
function exclusion(p){
  if(p.status&&p.status!=='재직')return `평가 제외 — ${p.status}`;
  const es=new Date(evalStart()+'T00:00');
  if(p.hired){const h=new Date(p.hired+'T00:00');const m=new Date(es);m.setMonth(m.getMonth()-6);if(h>m)return '평가 제외 — 평가개시일 기준 근속 6개월 미만'}
  if(p.returned){const r=new Date(p.returned+'T00:00');const m=new Date(es);m.setMonth(m.getMonth()-2);if(r>m)return '평가 제외 — 복귀 후 2개월 미경과'}
  return null;
}
function obsCheck(p){
  const o=(p.obs||[]).filter(x=>x.date&&x.date.startsWith(String(year())));
  if(o.length<3)return {lvl:'w',msg:`올해 관찰기록 ${o.length}건 — 평가 근거가 부족해요`};
  const last=o.filter(x=>x.date>=`${year()}-11-01`).length;
  if(last/o.length>0.6)return {lvl:'w',msg:`관찰기록의 ${Math.round(last/o.length*100)}%가 11~12월 — 최근 실적 편중 주의(제7조 5호)`};
  return null;
}

function vDash(){
  const act=active(), cs=act.map(p=>({p,c:calc(p)})), tots=cs.map(x=>x.c.total).filter(v=>v!=null);
  const avg=tots.length?tots.reduce((a,b)=>a+b,0)/tots.length:null, tgt=config.target||85;
  const dist={S:0,A:0,B:0,C:0,D:0}; let n=0; act.forEach(p=>Object.values((p.eval&&p.eval.grades)||{}).forEach(g=>{if(dist[g]!=null){dist[g]++;n++}}));
  const alerts=[];
  if(avg!=null&&avg>tgt+3)alerts.push(['w',`평균 ${fmt(avg)}점 — 권고(${tgt}점 수준)보다 높아요. 관대화 경향 점검`]);
  if(avg!=null&&avg<tgt-3)alerts.push(['w',`평균 ${fmt(avg)}점 — 권고(${tgt}점 수준)보다 낮아요. 엄격화 경향 점검`]);
  if(n>=20&&dist.B/n>0.7)alerts.push(['w',`전체 등급의 ${Math.round(dist.B/n*100)}%가 B — 중심화 경향 점검`]);
  const same=cs.filter(x=>{const g=Object.values((x.p.eval&&x.p.eval.grades)||{});return g.length>=items(x.p.job).length&&new Set(g).size===1}).map(x=>x.p.name);
  if(same.length)alerts.push(['w',`모든 항목이 같은 등급: ${same.join(', ')} — 후광효과 점검`]);
  const missingNar=cs.filter(x=>x.c.total!=null&&!((x.p.eval&&x.p.eval.closed)||'').replace(/＊[^:]+:/g,'').trim()).map(x=>x.p.name);
  if(missingNar.length)alerts.push(['e',`비계량평가(필수) 미작성: ${missingNar.join(', ')}`]);
  const weak=act.filter(p=>obsCheck(p)).map(p=>p.name);
  if(weak.length)alerts.push(['w',`관찰 근거 점검 필요: ${weak.join(', ')}`]);
  const C={S:'var(--S)',A:'var(--A)',B:'var(--B)',C:'var(--C)',D:'var(--D)'};
  return hdr('병동 현황',`${esc(profile.ward)} · ${year()}년도`)+`
  <button class="btn ghost" style="width:100%;margin-bottom:12px" data-act="docWard">📄 병동 보고서 만들기 (PDF · 공유)</button>
  <div class="card"><h2>평균 점수 <span class="muted">권고 ${tgt}점 수준</span></h2>
   <div class="sum"><div><b>${fmt(avg)}</b><span>평균(1차)</span></div><div><b>${tots.length}</b><span>점수 산출</span></div><div><b>${act.length}</b><span>평가 대상</span></div></div>
   <h3>등급 분포 (전 항목 ${n}건)</h3>
   ${n?`<div class="dist">${GRADES.map(([g])=>dist[g]?`<i style="width:${dist[g]/n*100}%;background:${C[g]}">${g} ${dist[g]}</i>`:'').join('')}</div>`:'<div class="muted">아직 입력된 등급이 없어요</div>'}</div>
  ${(()=>{const w=wardIndex();if(!w)return '';const paths={};active().forEach(x=>selectedPaths(x).forEach(k=>paths[k]=(paths[k]||0)+1));const tot=active().length;
    return `<div class="card"><h2>병동 역량지수 <span class="muted">${w.n}명 평균</span></h2><div style="display:flex;justify-content:center">${radarSvg([{v:w.axes.map(a=>a.v),color:'#2F6FA8',fill:'#2F6FA8'}],AXES.map(a=>a.name),280)}</div>
     <p class="muted" style="font-size:12px">가장 낮은 역량: ${w.axes.filter(a=>a.v!=null).sort((a,b)=>a.v-b.v).slice(0,2).map(a=>`${a.name}(${Math.round(a.v)})`).join(', ')} — 병동 교육 계획에 참고하세요.</p></div>
     <div class="card"><h2>커리어 관심 분포 <span class="muted">${tot}명</span></h2>${Object.keys(paths).length?CAREER_PATHS.filter(c=>paths[c.k]).sort((a,b)=>paths[b.k]-paths[a.k]).map(c=>`<div style="margin-bottom:6px"><div class="row" style="justify-content:space-between;font-size:13px"><span>${c.name}</span><b>${paths[c.k]}명</b></div><div class="bar"><i style="width:${paths[c.k]/tot*100}%"></i></div></div>`).join(''):'<p class="muted">아직 고른 경로가 없어요.</p>'}<p class="muted" style="font-size:12px">개인 ‘성장’ 탭에서 고른 경로 (없으면 설문 · 면담에서 찾은 경로)</p></div>`})()}
  <div class="card"><h2>평가 오류 점검</h2>${alerts.length?alerts.map(([l,m])=>`<div class="alert ${l}">${esc(m)}</div>`).join(''):'<div class="alert ok">지금까지 특이사항이 없어요</div>'}</div>
  <div class="card"><h2>개인별 점수</h2><table><tr><th>성명</th><th class="n">업적</th><th class="n">역량</th><th class="n">종합</th></tr>
   ${sorted(cs.slice()).sort((a,b)=>(b.c.total??-1)-(a.c.total??-1)).map(x=>`<tr><td>${esc(x.p.name)}</td><td class="n">${fmt(x.c.perf)}</td><td class="n">${fmt(x.c.comp)}</td><td class="n"><b>${fmt(x.c.total)}</b></td></tr>`).join('')}</table></div>
  <div class="card aic"><h2>설문 종합 <button class="btn ghost sm" data-ai="ward">AI 종합</button></h2>
   <div class="ai muted" id="ai-ward">${esc(aiCache.ward||'면담 사전 설문의 건의사항·교육 요구·희망 부서를 주제별로 묶고, 수간호사가 해볼 수 있는 조치를 제안해요.')}</div></div>`;
}

function hisText(p){
  const t=T(p.job),g=(p.eval&&p.eval.grades)||{},b=(p.eval&&p.eval.basis)||{},c=calc(p),e=p.eval||{};
  const ln=i=>`  ${i.name}: ${g[i.k]?`${g[i.k]}(${GPT[g[i.k]]})`:'-'}${b[i.k]?` — ${b[i.k]}`:''}`;

}

let importRows=null;
function parseDelim(text){
  const delim=(text.split('\n')[0].match(/\t/g)||[]).length>=(text.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],f='',qd=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(qd){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else qd=false}else f+=ch}
    else if(ch==='"'&&f==='')qd=true;
    else if(ch===delim){row.push(f);f=''}
    else if(ch==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f=''}
    else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res();const s=document.createElement('script');s.src='vendor/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function importFile(file){
  try{
    let rows;
    if(/\.xlsx?$/i.test(file.name)){await loadXLSX();const wb=XLSX.read(await file.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(String))}
    else rows=parseDelim((await file.text()).replace(/^﻿/,''));
    const head=rows[0]||[]; const ni=head.findIndex(h=>/성명|이름|name/i.test(h));
    if(ni<0){toast('‘성명’ 또는 ‘이름’ 열을 찾지 못했어요');return}
    const ti=head.findIndex(h=>/타임스탬프|timestamp/i.test(h));
    const skip=i=>i===ni||i===ti||!String(head[i]||'').trim()||/비상연락|주소|전화|연락처|주민|이메일|e-?mail/i.test(head[i]);
    const clean=h=>h.replace(/\s+/g,' ').replace(/^\s*\d+\.\s*/,'').split(/ : |\(ex/)[0].trim().slice(0,60);
    const data=rows.slice(1).filter(r=>(r[ni]||'').trim()).map(r=>({name:r[ni].trim(),date:ti>=0?String(r[ti]).split(/ 오| [0-9]/)[0]:'',survey:head.map((h,i)=>skip(i)?null:{q:clean(h),a:String(r[i]||'').trim()}).filter(Boolean)}));
    const excluded=head.filter((h,i)=>i!==ni&&i!==ti&&String(h).trim()&&skip(i)).map(clean);
    if(!data.length){toast('응답 행이 없어요');return}
    importRows=data;
    const names=new Set(Object.values(staff).map(s=>s.name));
    const upd_=data.filter(d=>names.has(d.name)).length;
    modal(`<h3>설문 가져오기</h3><p>${data.length}명 · 질문 ${data[0].survey.length}개</p>
     <p class="muted" style="margin:6px 0">새로 추가 ${data.length-upd_}명 · 기존 직원 설문 업데이트 ${upd_}명</p>
     ${excluded.length?`<div class="alert ok">개인정보 열 제외: ${esc(excluded.join(', '))}</div>`:''}
     <p class="muted">${esc(data.map(d=>d.name).join(', '))}</p>
     <p class="muted" style="margin-top:6px">새로 추가되는 직원은 ‘간호직’ 평가표로 들어가요. 간호운영기능직은 정보 탭에서 바꿔 주세요.</p>
     <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn" data-act="doImport">가져오기</button></div>`);
  }catch(err){toast('파일을 읽지 못했어요')}
}
function doImport(){
  const byName=Object.fromEntries(Object.values(staff).map(s=>[s.name,s]));
  importRows.forEach(d=>{const ex=byName[d.name];if(ex)put(ex.id,{...ex,survey:d.survey,surveyDate:d.date});else put('s_'+uid(),{kind:'staff',name:d.name,job:'nurse',status:'재직',obs:[],survey:d.survey,surveyDate:d.date})});
  toast(`${importRows.length}명 가져왔어요`);importRows=null;closeModal();view='list';render();
}

function aiOn(){return !!(profile&&profile.aiEndpoint)}
function getSample(){
  if(!aiOn())return null;
  const f=async(prompt,opts={})=>{
    const r=await fetch(profile.aiEndpoint,{method:'POST',headers:{'Content-Type':'application/json',...(profile.aiToken?{Authorization:'Bearer '+profile.aiToken}:{})},body:JSON.stringify({prompt,tier:opts.modelTier||'default'})});
    if(r.status===429)throw{code:'rate_limited'};
    if(!r.ok)throw{code:'http_'+r.status};
    const j=await r.json();return {text:String(j.text||'')};
  };
  f.json=async(prompt,opts)=>{const {text}=await f(prompt+'\n\n다른 설명 없이 JSON 객체 하나만 출력하세요.',opts);const m=text.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null};
  return f;
}
const ROLE=`당신은 대학병원 간호부 수간호사(1차 평가자)의 연말 인사평가를 돕는 조수입니다. 병원 인사평가규정의 평가원칙을 따릅니다: ${PRINCIPLES.join('; ')}. 관찰기록·면담기록·평가자가 적은 근거만 사실로 사용하고, 없는 사실은 지어내지 않습니다. 육아·연애·결혼·건강·가족 등 사생활은 평가에 반영하지 않습니다. 한국어, 정중하고 객관적인 문체. 마크다운 기호(#, **)는 쓰지 않습니다.`;
const WORK_Q=/교육|수상|학회|자격|목표|노력|희망|부서|건의|역할|프로젝트|업무/;
function dossier(p,{personal=false}={}){
  const its=items(p.job),g=(p.eval&&p.eval.grades)||{},b=(p.eval&&p.eval.basis)||{};
  const sv=(p.survey||[]).filter(x=>x.a&&(personal||WORK_Q.test(x.q)));
  return `성명: ${p.name} / 평가표: ${T(p.job).label} / 직급·연차: ${p.rank||'-'} / 역할: ${p.role||'-'}
[평가 항목과 정의]\n${its.map(i=>`- ${i.name}(${i.k}): ${i.def}`).join('\n')}
[관찰기록]\n${(p.obs||[]).map(o=>`- ${o.date} [${(its.find(i=>i.k===o.item)||{}).name||o.item}] ${o.kind==='good'?'우수':'개선필요'}: ${o.text}`).join('\n')||'없음'}
[면담기록]\n${(p.interview&&p.interview.text)||'없음'}
[평가자가 입력한 등급·근거]\n${its.map(i=>`- ${i.name}: ${g[i.k]||'미입력'}${b[i.k]?' / '+b[i.k]:''}`).join('\n')}
[면담 사전 설문${personal?'':'(업무 관련 문항만)'}]\n${sv.map(x=>`- ${x.q}: ${x.a}`).join('\n')||'없음'}`;
}

/* ===================== 역량지수 · 경력개발 컨설팅 =====================
   역량지수 6축: 업무성과(업적 2항목) · 고객지향 · 자기계발 · 혁신·개선 · 협업(팀웍) · 직무역량(직무역량 3항목)
   값 = 해당 항목 등급 점수 평균(S100 · A90 · B80 · C70 · D60). 평가 탭 등급에서 자동 계산.
   개인 사정(설문의 생활 관련 답)은 평가에는 쓰지 않고, 본인이 밝힌 목표 범위에서 경력 상담에만 씁니다. */
const AXES=[{name:'업무성과',pick:(t,i)=>t.perf.includes(i)},{name:'고객지향',pick:(t,i)=>i.k==='cust'},{name:'자기계발',pick:(t,i)=>i.k==='self'},
 {name:'혁신·개선',pick:(t,i)=>i.k==='innov'},{name:'협업',pick:(t,i)=>i.k==='team'},
 {name:'직무역량',pick:(t,i)=>t.comp.includes(i)&&!['cust','self','innov','team'].includes(i.k)}];
function compIndex(p){

  const list=arr=>arr.length?`<ul style="margin:4px 0 8px 18px;padding:0">${arr.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'<div class="box muted">응답 없음</div>';
  const body=`<h2>평가 개요</h2>
   <table class="info"><tr><td>전체 인원</td><td>${all.length}명</td><td>평가 대상</td><td>${act.length}명 (${Object.entries(jobs).map(([l,c])=>`${esc(l)} ${c}`).join(', ')||'-'})</td></tr>
   <tr><td>평가 제외</td><td>${exs.length}명</td><td>평가 완료</td><td>${done}명 / ${act.length}명</td></tr>
   <tr><td>평균(1차)</td><td>${fmt(avg)}점</td><td>권고 수준</td><td>${tgt}점 내외</td></tr></table>
   ${exs.length?`<p class="muted" style="font-size:9pt;margin:0">제외 사유: ${exs.map(p=>esc(exclusion(p).replace('평가 제외 — ',''))).filter((v,i,a)=>a.indexOf(v)===i).join(', ')} (규정 제8조)</p>`:''}
   <h2>등급 분포 (전 항목 ${n}건)</h2>
   <table><tr>${GRADES.map(([g,l])=>`<th class="c">${g} (${l})</th>`).join('')}</tr><tr>${GRADES.map(([g])=>`<td class="c">${dist[g]}건${n?` (${Math.round(dist[g]/n*100)}%)`:''}<br><span class="bar" style="width:${n?dist[g]/n*90:0}px"></span></td>`).join('')}</tr></table>
   ${withPeople?`<h2>개인별 점수</h2><table><tr><th>성명</th><th>직종</th><th class="c">업적</th><th class="c">역량</th><th class="c">종합</th></tr>${cs.sort((a,b)=>(b.c.total??-1)-(a.c.total??-1)).map(x=>`<tr><td>${esc(x.p.name)}</td><td>${esc(T(x.p.job).label.replace('(부서원)',''))}</td><td class="c">${fmt(x.c.perf)}</td><td class="c">${fmt(x.c.comp)}</td><td class="c"><b>${fmt(x.c.total)}</b></td></tr>`).join('')}</table>`:''}
   ${withSurvey?`<h2>면담 사전 설문 종합 (응답 ${sv.length}명)</h2>
     ${aiCache.ward?`<div class="box">${esc(aiCache.ward)}</div>`:`<h3>병동 건의사항</h3>${list(pick(/건의/))}<h3>내년 희망 교육·관심 분야</h3>${list(pick(/듣고 싶은 교육|희망 교육|관심있는 분야/))}`}`:''}`;
  return docShell(`${year()}년도 병동 인사평가 종합 보고서`,body,{confidential:withPeople,note:withPeople?'':'본 문서는 개인 점수를 포함하지 않은 병동 단위 요약입니다. 설문 응답은 작성자 이름 없이 정리했습니다.'});
}

   <p class="muted" style="margin-top:8px;font-size:12px">‘설문 종합’에서 AI 종합을 먼저 만들어 두면 그 내용이 보고서에 들어가요.</p>

function makeDoc(kind){
  const p=staff[cur];let html,name;
  const stamp=today().replace(/-/g,'');
  if(kind==='feedback'){html=docFeedback(p);name=`${p.name}_인사평가피드백_${year()}`}
  else if(kind==='career'){html=docCareer(p);name=`${p.name}_경력개발컨설팅_${year()}`}
  else if(kind==='report'||kind==='reportObs'){html=docReport(p,kind==='reportObs');name=`${p.name}_인사평가보고서_${year()}`}
  else if(kind==='wardSummary'){html=docWardReport({withPeople:false,withSurvey:true});name=`${profile.ward}_인사평가요약_${year()}`}
  else{html=docWardReport({withPeople:true,withSurvey:true});name=`${profile.ward}_인사평가종합_${year()}`}
  closeModal();
  if(/report|wardFull/.test(kind)&&!/Summary/.test(kind))toast('대외비 문서예요 — 열람 권한자에게만 공유하세요');
  exportDoc(html,name.replace(/\s/g,'')+'_'+stamp);
}
function exportDoc(html,name){
  if(window.NUAndroid&&NUAndroid.printHtml){NUAndroid.printHtml(name,html);return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name+'.html';document.body.appendChild(a);a.click();a.remove();toast('문서 파일을 저장했어요 — 열어서 인쇄·PDF 저장하세요')}
  catch(e){copy(html)}
}
window.__docTest={docFeedback,docReport,docWardReport};

/* ===================== PIN 잠금 ===================== */
let pinBuf='',pinMode='unlock',pinFirst='';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const dots=()=>`<div class="pin">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>`;
const pad_=()=>`<div class="keys">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button data-key="${k}">${k}</button>`).join('')}</div>`;
function vLock(){return `<div class="lock"><span class="logo" style="width:56px;height:56px;font-size:18px">NU</span><h2>Nurse United</h2><p class="muted" id="pinMsg">PIN을 입력하세요</p><div id="pinDots">${dots()}</div>${pad_()}</div>`}
function pinSheet(msg){return `<div class="lock" style="min-height:auto;padding:10px 0"><p id="pinMsg">${msg}</p><div id="pinDots">${dots()}</div>${pad_()}<button class="btn ghost" data-act="closeModal">취소</button></div>`}
async function pinKey(k){
  if(k==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
  const dd=$('#pinDots');if(dd)dd.innerHTML=dots();
  if(pinBuf.length<4)return;
  const entered=pinBuf;pinBuf='';
  if(locked){
    if(await sha('nu:'+entered)===pinHash()){locked=false;render()}
    else{$('#pinMsg').textContent='PIN이 맞지 않아요';$('#pinDots').innerHTML=dots()}
    return;
  }
  if(pinMode==='set1'){pinFirst=entered;pinMode='set2';$('#pinMsg').textContent='한 번 더 입력하세요';$('#pinDots').innerHTML=dots();return}
  if(pinMode==='set2'){
    if(entered===pinFirst){setPinHash(await sha('nu:'+entered));closeModal();render();toast('PIN 잠금을 켰어요')}
    else{pinMode='set1';$('#pinMsg').textContent='일치하지 않아요. 새 PIN을 다시 입력하세요';$('#pinDots').innerHTML=dots()}
  }
}
function nuLock(){if(profile&&pinHash()&&!locked){locked=true;pinBuf='';closeModal();render()}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)nuLock()});
/* 안드로이드 뒤로 가기: 처리했으면 true */
function nuBack(){
  if($('#modal').innerHTML){closeModal();return true}
  if(locked||!profile)return false;
  if(view==='person'){view='list';render();scrollTo(0,0);return true}
  if(view!=='list'){view='list';render();scrollTo(0,0);return true}
  return false;
}
window.nuLock=nuLock;window.nuBack=nuBack;

/* ===================== 백업·복원 ===================== */
async function backup(){
  const name=`NurseUnited_${(profile.ward||'').replace(/\s/g,'')}_${today()}.json`;
  const {aiToken,...pf}=profile;
  const data=JSON.stringify({app:'nurse-united',v:1,exportedAt:new Date().toISOString(),profile:pf,config,staff},null,1);
  try{
    if(window.NUAndroid){NUAndroid.saveFile(name,'application/json',data);return}
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
    toast('백업 파일을 만들었어요');
  }catch(e){copy(data)}
}
let restoreData=null;
async function restoreFile(file){
  try{
    const d=JSON.parse(await file.text());
    if(d.app!=='nurse-united'||!d.staff){toast('Nurse United 백업 파일이 아니에요');return}
    restoreData=d;
    const n=Object.keys(d.staff).length;
    modal(`<h3>데이터 복원</h3><p>${esc(d.profile&&d.profile.ward||'')} · ${d.profile&&d.profile.year||''}년도 · 직원 ${n}명</p>
     <p class="muted" style="margin:6px 0">${Object.keys(staff).length?'지금 이 휴대폰에 있는 데이터를 모두 이 파일 내용으로 바꿔요. 되돌릴 수 없어요.':'이 파일 내용으로 시작해요.'}</p>
     <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-act="closeModal">취소</button><button class="btn" data-act="confirmRestore">복원</button></div>`);
  }catch(e){toast('파일을 읽지 못했어요')}
}
function applyRestore(){
  const d=restoreData;restoreData=null;
  const keep=profile?{aiEndpoint:profile.aiEndpoint||'',aiToken:profile.aiToken||''}:{};
  const {pinHash:_p,...dp}=d.profile||{};
  replaceAll({...dp,...keep},d.config||{templates:DEFAULT_TEMPLATES,target:85},d.staff,'복원했어요');
}
