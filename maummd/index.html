<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마음엠디 · 가족치료</title>
<style>
  :root { --bg:#F5F2EC; --card:#FFFDF9; --line:#E4DED3; --text:#2B2A28; --muted:#7A746A; --pri:#2F6B5E; --pri2:#E4EFEB; --acc:#D98C4A; --red:#B42318; --green:#2E7D4F; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif; word-break:keep-all; }
  body { padding-bottom:80px; }
  .demo { background:#FFF3DF; border-bottom:1px solid #EFD3A6; font-size:12px; padding:6px 12px; display:flex; justify-content:space-between; align-items:center; gap:6px; flex-wrap:wrap; }
  .demo button { font-size:12px; padding:4px 8px; margin-left:4px; }
  .demo button.on { background:var(--pri); color:#fff; border-color:var(--pri); }
  header { display:flex; align-items:center; gap:10px; padding:16px 16px 8px; max-width:720px; margin:0 auto; }
  header .brand { margin:0; font-size:12px; color:var(--pri); font-weight:700; letter-spacing:.03em; }
  header h1 { margin:2px 0 0; font-size:20px; }
  .back { font-size:30px; color:var(--pri); text-decoration:none; line-height:1; padding:0 6px 4px 0; }
  main { max-width:720px; margin:0 auto; padding:4px 14px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
  .card.hero { background:var(--pri2); border-color:#C9DED6; }
  .card.warn { background:#FFF3DF; border-color:#EFD3A6; }
  h2 { font-size:16px; margin:0 0 10px; } h3 { font-size:14px; margin:14px 0 8px; }
  p { line-height:1.6; margin:6px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .center { text-align:center; }
  .red { color:var(--red); font-size:12px; font-weight:700; } .green { color:var(--green); font-weight:700; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 0; }
  .lbl { font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea { display:block; width:100%; margin-top:4px; font-family:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); }
  textarea { resize:vertical; }
  button, .btn { font-family:inherit; font-size:15px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  button.primary, .btn.primary { background:var(--pri); color:#fff; border-color:var(--pri); font-weight:700; margin-top:12px; }
  .block { display:block; width:100%; }
  .btn.small { padding:6px 12px; font-size:14px; }
  button.link { border:none; background:none; color:var(--pri); padding:8px 0; text-decoration:underline; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; align-items:center; } .row.wrap { flex-wrap:wrap; }
  .row.mem input { flex:1.4; margin:0; } .row.mem select { flex:1; margin:0; } .row.mem { margin-top:8px; }
  .spread { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pill { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; background:var(--pri2); color:var(--pri); font-weight:700; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .item:last-child { border-bottom:none; }
  .item > div { flex:1; min-width:0; }
  .item.now { background:var(--pri2); margin:0 -16px; padding:10px 16px; }
  .go { color:var(--muted); font-size:20px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .wk { flex:none; width:30px; height:30px; border-radius:50%; background:var(--pri2); color:var(--pri); font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .st { font-size:12px; padding:3px 8px; border-radius:6px; background:#EEE; color:#555; flex:none; }
  .st.done { background:#DDF1E4; color:var(--green); } .st.moved { background:#FCEBD7; color:#9A5A1C; } .st.absent { background:#FBE0DD; color:var(--red); }
  .alert { display:block; padding:10px 12px; border-radius:10px; margin:8px 0; text-decoration:none; color:var(--text); font-size:14px; }
  .alert.red { background:#FBE0DD; } .alert.amber { background:#FCEBD7; } .alert.blue { background:#E2ECF7; }
  .tabs { display:flex; gap:4px; background:#EAE5DC; padding:4px; border-radius:12px; margin-bottom:6px; }
  .tabs a { flex:1; text-align:center; padding:8px 0; border-radius:9px; color:var(--muted); text-decoration:none; font-size:14px; }
  .tabs a.on { background:#fff; color:var(--pri); font-weight:700; }
  .chk { display:inline-flex; align-items:center; gap:6px; color:var(--text); font-size:15px; margin:6px 12px 0 0; }
  .chk input { width:auto; display:inline; margin:0; }
  .items { display:grid; grid-template-columns:repeat(auto-fill, minmax(64px,1fr)); gap:8px; }
  .it { margin:0; display:flex; flex-direction:column; align-items:center; font-weight:700; color:var(--text); }
  .it select { text-align:center; padding:8px 4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:12px; padding:6px 4px; border-bottom:1px solid var(--line); }
  td { padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .answer { background:#F7F4EE; border-radius:10px; padding:10px 12px; white-space:pre-wrap; }
  .code { font-family:monospace; letter-spacing:.08em; color:var(--text); }
  .q { padding:8px 0; border-bottom:1px solid var(--line); }
  .scale { display:flex; gap:6px; }
  .scale label { flex:1; margin:0; }
  .scale input { display:none; }
  .scale span { display:block; text-align:center; padding:10px 0; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--text); font-weight:700; }
  .scale input:checked + span { background:var(--pri); color:#fff; border-color:var(--pri); }
  nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav a { flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:20px; padding:8px 0 10px; }
  nav a span { display:block; font-size:11px; }
  nav a.on { color:var(--pri); font-weight:700; }
  .heroart { margin:0 -14px 10px; border-radius:0 0 18px 18px; overflow:hidden; line-height:0; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .stats div { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 4px; text-align:center; }
  .stats b { display:block; font-size:22px; color:var(--pri); } .stats span { font-size:11px; color:var(--muted); }
  .stats .hot { background:#FBE0DD; border-color:#F2B8B0; } .stats .hot b { color:var(--red); }
  .mini { display:block; height:6px; background:#EEE8DE; border-radius:9px; margin-top:6px; overflow:hidden; } .mini i { display:block; height:100%; border-radius:9px; }
  .progs { display:grid; gap:8px; margin-top:8px; }
  .prog { margin:0; } .prog input { display:none; }
  .prog > span { display:flex; gap:12px; align-items:center; padding:10px; border:2px solid var(--line); border-radius:14px; background:#fff; color:var(--text); }
  .prog > span > span { display:flex; flex-direction:column; min-width:0; }
  .prog b { font-size:15px; } .prog em { font-style:normal; font-size:12px; color:var(--pri); font-weight:700; } .prog small { font-size:12px; color:var(--muted); line-height:1.5; }
  .prog input:checked + span { border-color:var(--pri); background:var(--pri2); }
  .pv { margin-top:12px; display:grid; gap:8px; } .pvp { background:#F7F4EE; border-radius:12px; padding:8px 12px; }
  .pvp ol { margin:6px 0 0; padding-left:30px; font-size:13px; color:#4A463F; columns:2; column-gap:18px; } .pvp li { break-inside:avoid; margin:2px 0; }
  .note { background:#F1F6F4; border:1px dashed #A9C9BD; border-radius:10px; padding:8px 10px; font-size:13px; color:#3D5E55; line-height:1.55; }
  .dice { flex:none; font-size:20px; padding:8px 10px; }
  .row input { margin-top:0; } .row select { margin-top:0; }
  .mem2 { border:1px solid var(--line); border-radius:12px; padding:8px; margin-top:8px; display:grid; gap:6px; background:#fff; }
  .avatar { flex:none; width:34px; height:34px; border-radius:50%; color:#fff; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .pill.gray { background:#EEE9E0; color:#5F5A52; }
  .hbars { display:grid; gap:8px; } .hb { display:grid; grid-template-columns:72px 1fr 58px; gap:8px; align-items:center; font-size:13px; }
  .hl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb b { text-align:right; font-size:12px; }
  .ht { height:12px; background:#EEE8DE; border-radius:9px; overflow:hidden; } .ht i { display:block; height:100%; border-radius:9px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; font-size:12px; color:var(--muted); margin-top:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .dash { display:flex; justify-content:space-around; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
  .donut { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; } .donut .legend { flex-direction:column; align-items:flex-start; }
  .empty { text-align:center; padding:6px 0; }
  .pastlist { max-height:260px; overflow:auto; margin:8px 0; background:#fff; border-radius:10px; padding:4px 10px; border:1px solid var(--line); }
  .pastrow { display:flex; align-items:flex-start; margin:6px 0; font-size:14px; } .pastrow input { margin-top:3px; }
  #toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:#2B2A28; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; max-width:90vw; }
  #toast.show { opacity:1; }
</style>
</head>
